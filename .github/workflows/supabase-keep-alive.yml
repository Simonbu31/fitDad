name: Keep Supabase project alive

# Supabase's free tier auto-pauses a project after 7 days with no API
# activity (this is what happened to Fit Dad's backend once already —
# see repo history). Running a trivial read every 3 days keeps it well
# under that threshold, with margin for GitHub's scheduling jitter.
on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_MxSjKbGQJZplj35eya57tA_snycn4mU" \
            "https://qsgkxvarnolcufawpcvh.supabase.co/rest/v1/exercises?select=id&limit=1")
          echo "Supabase responded with HTTP $status"
          # 200/206 = reached the DB (rows may be empty due to RLS, that's fine —
          # the point is the request itself counts as activity).
          if [ "$status" -ge 500 ]; then
            echo "::error::Supabase ping failed with server error $status"
            exit 1
          fi
